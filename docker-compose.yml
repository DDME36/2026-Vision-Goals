# Deploy on Coolify: New Resource → Docker Compose → point it at this repo.
# Set POSTGRES_PASSWORD (and optionally the other variables) in Coolify's Environment tab,
# then attach your domain to the `app` service on port 3000.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BRAND_URL: ${NEXT_PUBLIC_BRAND_URL:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vision}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vision_goals}
      APP_URL: ${APP_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vision_goals}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
